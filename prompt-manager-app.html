<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Manager - Gestione Prompts</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Prompt Manager">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        :root {
            /* Light mode colors */
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b92a9;
            --success: #10b981;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --shadow-hover: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
            --bg-prompt: #f8fafc;
            --bg-input: #ffffff;
            --modal-bg: rgba(0, 0, 0, 0.5);
        }

        [data-theme="dark"] {
            /* Dark mode colors */
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --secondary: #6b7280;
            --success: #34d399;
            --bg-main: #111827;
            --bg-card: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border: #374151;
            --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.4);
            --shadow-hover: 0 10px 20px rgba(0,0,0,0.4), 0 6px 6px rgba(0,0,0,0.5);
            --bg-prompt: #374151;
            --bg-input: #374151;
            --modal-bg: rgba(0, 0, 0, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--bg-card);
            box-shadow: var(--shadow);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 600;
        }

        .layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .sidebar {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 20px;
            height: calc(100vh - 120px);
            overflow-y: auto;
            box-shadow: var(--shadow);
            position: sticky;
            top: 100px;
        }

        .sidebar h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .category-nav {
            list-style: none;
        }

        .category-item {
            margin-bottom: 5px;
        }

        .category-link {
            display: block;
            padding: 8px 12px;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .category-link:hover {
            background: var(--primary);
            color: white;
        }

        .category-link.active {
            background: var(--primary);
            color: white;
            font-weight: 500;
        }

        .sidebar .external-links-title {
            margin-top: 30px;
        }

        .main-content {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-bar {
            flex: 1;
            min-width: 250px;
            padding: 10px 15px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .search-bar::placeholder {
            color: var(--text-secondary);
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--secondary);
        }

        .btn-secondary:hover {
            background: #6b7280;
        }

        .category-section {
            margin-bottom: 40px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }

        .category-title {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .prompt-card {
            background: var(--bg-prompt);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .prompt-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .prompt-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .prompt-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 12px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .copy-btn.copied {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .favorite-btn {
            transition: all 0.3s ease;
        }

        .favorite-btn.favorited {
            background: #fbbf24;
            color: white;
            border-color: #fbbf24;
        }

        .favorite-btn:hover {
            background: #fbbf24;
            color: white;
            border-color: #fbbf24;
        }

        .prompt-content {
            background: var(--bg-input);
            color: var(--text-primary);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .prompt-content.expanded {
            max-height: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.3rem;
            color: var(--primary);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: border-color 0.3s;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-textarea {
            min-height: 150px;
            resize: vertical;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            flex: 1;
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .backup-reminder {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 20px;
        }

        .backup-reminder[hidden] {
            display: none;
        }

        .backup-reminder span {
            flex: 1;
            min-width: 200px;
        }

        [data-theme="dark"] .backup-reminder {
            background: #451a03;
            color: #fde68a;
            border-color: #92400e;
        }

        /* Overlay: finestra compatta sempre in primo piano (usa gli stessi stili dell'app) */
        .overlay {
            padding: 12px;
        }

        .overlay-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin: 8px 0;
        }

        .overlay-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .overlay-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .overlay-box {
            margin-bottom: 12px;
        }

        .overlay-box .form-textarea {
            min-height: 90px;
        }

        .overlay-empty {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            box-shadow: var(--shadow);
            transform: translateX(400px);
            transition: transform 0.3s;
            z-index: 2000;
        }

        .toast.show {
            transform: translateX(0);
        }

        /* Focus styles per keyboard navigation */
        button:focus,
        input:focus,
        select:focus,
        textarea:focus,
        .category-link:focus,
        .action-btn:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        
        /* Skip links */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 6px;
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            z-index: 1001;
            transition: top 0.3s;
        }
        
        .skip-link:focus {
            top: 6px;
        }
        
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        /* Keyboard help */
        .keyboard-help {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 15px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            font-size: 0.8em;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            max-width: 250px;
        }
        
        .keyboard-help.show {
            opacity: 1;
        }
        
        /* Modal focus trap */
        .modal.active .modal-content {
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                height: auto;
                margin-bottom: 20px;
            }

            .header-content {
                flex-direction: column;
                gap: 10px;
            }

            .main-content {
                padding: 15px;
            }

            .prompt-header {
                flex-direction: column;
                gap: 10px;
            }

            .category-header {
                flex-wrap: wrap;
                gap: 10px;
            }

            .search-bar {
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <!-- PWA Install Button -->
    <div id="pwa-install" style="position: fixed; top: 20px; left: 20px; z-index: 1001; display: none;">
        <button onclick="installPWA()" style="
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        " title="Installa Prompt Manager come app">
            📱 Installa App
        </button>
    </div>

    <a href="#main-content" class="skip-link">Salta al contenuto principale</a>
    
    <header role="banner">
        <div class="header-content">
            <h1>📝 Prompt Manager</h1>
            <div>
                <button class="theme-toggle" onclick="toggleTheme()" title="Cambia tema" aria-label="Cambia tema">
                    <span id="theme-icon" aria-hidden="true">🌙</span>
                    <span id="theme-text">Dark</span>
                </button>
                <button class="btn btn-secondary" onclick="openOverlay()" title="Finestra sempre in primo piano con preferiti e box di testo">📌 Overlay</button>
                <button class="btn btn-secondary" onclick="exportData()">📥 Esporta</button>
                <button class="btn btn-secondary" onclick="importData()">📤 Importa</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="layout">
            <aside class="sidebar">
                <h2>Categorie</h2>
                <ul class="category-nav" id="categoryNav">
                    <!-- Categorie dinamiche -->
                </ul>
                <button class="btn" style="width: 100%; margin-top: 20px;" onclick="openAddCategoryModal()">
                    + Nuova Categoria
                </button>

                <!-- Raccolte pubbliche da cui prendere spunto: si aprono in una nuova scheda -->
                <h2 class="external-links-title">Librerie di prompt</h2>
                <ul class="category-nav">
                    <li class="category-item"><a class="category-link" href="https://github.com/f/prompts.chat" target="_blank" rel="noopener" title="La raccolta pubblica di prompt più grande">prompts.chat ↗</a></li>
                    <li class="category-item"><a class="category-link" href="https://github.com/MrXie23/PromptLibrary" target="_blank" rel="noopener" title="Prompt in più lingue, divisi per categoria">PromptLibrary ↗</a></li>
                    <li class="category-item"><a class="category-link" href="https://github.com/The-Focus-AI/prompt-library" target="_blank" rel="noopener" title="Libreria di prompt con PWA e CLI">The Focus AI ↗</a></li>
                    <li class="category-item"><a class="category-link" href="https://github.com/thibaultyou/prompt-library" target="_blank" rel="noopener" title="Prompt curati da eseguire da riga di comando">prompt-library ↗</a></li>
                    <li class="category-item"><a class="category-link" href="https://github.com/hhkaos/biblioteca-de-prompts-para-estudiar-con-ia" target="_blank" rel="noopener" title="Prompt per studiare con l'IA (in spagnolo)">Prompt per studiare ↗</a></li>
                </ul>
            </aside>

            <main class="main-content" id="main-content" role="main">
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">Totale Prompt</div>
                        <div class="stat-value" id="totalPrompts">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Categorie</div>
                        <div class="stat-value" id="totalCategories">0</div>
                    </div>
                </div>

                <div class="backup-reminder" id="backupReminder" hidden>
                    <span id="backupReminderText"></span>
                    <button class="btn" onclick="exportData()">📥 Esporta ora</button>
                    <button class="close-modal" onclick="document.getElementById('backupReminder').hidden = true" aria-label="Chiudi promemoria">&times;</button>
                </div>

                <div class="controls">
                    <input type="text" class="search-bar" id="searchBar" placeholder="🔍 Cerca prompt...">
                    <button class="btn" onclick="openAddPromptModal()">+ Aggiungi Prompt</button>
                </div>

                <div id="promptsContainer">
                    <!-- Prompt dinamici -->
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Aggiungi Prompt -->
    <div class="modal" id="addPromptModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Aggiungi Nuovo Prompt</h2>
                <button class="close-modal" onclick="closeModal('addPromptModal')">&times;</button>
            </div>
            <form id="addPromptForm">
                <div class="form-group">
                    <label class="form-label">Titolo</label>
                    <input type="text" class="form-input" id="promptTitle" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Categoria</label>
                    <select class="form-select" id="promptCategory" required>
                        <!-- Opzioni dinamiche -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Contenuto Prompt</label>
                    <textarea class="form-textarea" id="promptContent" required></textarea>
                </div>
                <button type="submit" class="btn">Salva Prompt</button>
            </form>
        </div>
    </div>

    <!-- Modal Modifica Prompt -->
    <div class="modal" id="editPromptModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Modifica Prompt</h2>
                <button class="close-modal" onclick="closeModal('editPromptModal')">&times;</button>
            </div>
            <form id="editPromptForm">
                <input type="hidden" id="editPromptId">
                <div class="form-group">
                    <label class="form-label">Titolo</label>
                    <input type="text" class="form-input" id="editPromptTitle" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Categoria</label>
                    <select class="form-select" id="editPromptCategory">
                        <!-- Opzioni dinamiche -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Contenuto Prompt</label>
                    <textarea class="form-textarea" id="editPromptContent" required></textarea>
                </div>
                <button type="submit" class="btn">Salva Modifiche</button>
            </form>
        </div>
    </div>

    <!-- Modal Aggiungi Categoria -->
    <div class="modal" id="addCategoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Aggiungi Nuova Categoria</h2>
                <button class="close-modal" onclick="closeModal('addCategoryModal')">&times;</button>
            </div>
            <form id="addCategoryForm">
                <div class="form-group">
                    <label class="form-label">Nome Categoria</label>
                    <input type="text" class="form-input" id="categoryName" required>
                </div>
                <button type="submit" class="btn">Crea Categoria</button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <input type="file" id="importFile" style="display: none;" accept=".json">

    <script>
        // Dati iniziali dal documento
        const initialData = {
            categories: [
                { id: 'start', name: 'Start Here' },
                { id: 'research', name: 'Research' },
                { id: 'data-analysis', name: 'Data Analysis' },
                { id: 'study', name: 'Study' },
                { id: 'approfondimento', name: 'Approfondimento' },
                { id: 'creative', name: 'Creative / Image Generation' },
                { id: 'work', name: 'Work' }
            ],
            prompts: [
                {
                    id: 1,
                    category: 'start',
                    title: 'Framework CRAAFTED',
                    content: `Per strutturare prompt completi ed efficaci, il framework CRAAFTED è un modello riconosciuto e ampiamente utilizzato. Ogni lettera dell'acronimo CRAAFTED rappresenta un componente essenziale da includere nel prompt per massimizzare l'utilità dell'output:

Context (Contesto): La situazione o lo scenario generale della richiesta. "Sto preparando l'esame di Storia Moderna, focalizzandomi sul periodo della Rivoluzione Francese."
Role (Ruolo): La persona o la prospettiva che l'AI deve assumere. "Agisci come un professore universitario specializzato in storia."

Audience (Pubblico): Chi riceverà o leggerà l'output. "Spiega i concetti in modo che siano comprensibili a uno studente del primo anno di università."

        let data;
        try {
            data = JSON.parse(localStorage.getItem('promptManagerData')) || initialData;
        } catch (error) {
            console.error('Dati salvati non leggibili, uso i dati iniziali', error);
            data = initialData;
        }
        let currentCategory = 'all';
        let overlayWindow = null;

        // Evita che tag nei prompt (es. <instructions>) vengano interpretati come HTML
        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        
        // Inizializza favorites se non esistono
        if (!data.favorites) {
            data.favorites = [];
            saveData();
        }

        // Dark Mode Toggle System
        function initializeTheme() {
            const savedTheme = localStorage.getItem('promptManagerTheme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
            
            setTheme(theme);
            updateThemeToggle(theme);
        }
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (overlayWindow && !overlayWindow.closed) {
                overlayWindow.document.documentElement.setAttribute('data-theme', theme);
            }
            localStorage.setItem('promptManagerTheme', theme);
        }
        
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            setTheme(newTheme);
            updateThemeToggle(newTheme);
        }
        
        function updateThemeToggle(theme) {
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');
            
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark';
            }
        }
        
        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('promptManagerTheme')) {
                const theme = e.matches ? 'dark' : 'light';
                setTheme(theme);
                updateThemeToggle(theme);
            }
        });

        // Inizializzazione
        document.addEventListener('DOMContentLoaded', () => {
            initializeTheme();
            renderCategories();
            renderPrompts();
            updateStats();
            initializeKeyboardSupport();
            checkBackupReminder();

            // Chiede al browser di non cancellare automaticamente i dati quando lo spazio scarseggia
            if (navigator.storage && navigator.storage.persist) {
                navigator.storage.persist().catch(() => {});
            }
            
            // Event listeners
            document.getElementById('searchBar').addEventListener('input', (e) => {
                renderPrompts(e.target.value);
            });

            document.getElementById('addPromptForm').addEventListener('submit', handleAddPrompt);
            document.getElementById('editPromptForm').addEventListener('submit', handleEditPrompt);
            document.getElementById('addCategoryForm').addEventListener('submit', handleAddCategory);
            document.getElementById('importFile').addEventListener('change', handleImport);
        });

        function renderCategories() {
            const nav = document.getElementById('categoryNav');
            const favoritesCount = data.favorites ? data.favorites.length : 0;
            
            nav.innerHTML = `
                <li class="category-item">
                    <a href="#" class="category-link ${currentCategory === 'all' ? 'active' : ''}"
                       onclick="filterByCategory('all'); return false;">Tutti i Prompt</a>
                </li>
                <li class="category-item">
                    <a href="#" class="category-link ${currentCategory === 'favorites' ? 'active' : ''}"
                       onclick="filterByCategory('favorites'); return false;">⭐ Preferiti (${favoritesCount})</a>
                </li>
            `;

            data.categories.forEach(cat => {
                nav.innerHTML += `
                    <li class="category-item">
                        <a href="#" class="category-link ${currentCategory === cat.id ? 'active' : ''}"
                           data-category="${escapeHtml(cat.id)}"
                           onclick="filterByCategory(this.dataset.category); return false;">${escapeHtml(cat.name)}</a>
                    </li>
                `;
            });
        }

        function renderPrompts(searchTerm = document.getElementById('searchBar').value) {
            const container = document.getElementById('promptsContainer');
            let filteredPrompts = data.prompts;

            // Filtra per categoria
            if (currentCategory === 'favorites') {
                filteredPrompts = filteredPrompts.filter(p => data.favorites && data.favorites.includes(p.id));
            } else if (currentCategory !== 'all') {
                filteredPrompts = filteredPrompts.filter(p => p.category === currentCategory);
            }

            // Filtra per termine di ricerca (titolo, contenuto o nome categoria)
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filteredPrompts = filteredPrompts.filter(p => 
                    (p.title || '').toLowerCase().includes(term) ||
                    (p.content || '').toLowerCase().includes(term) ||
                    getCategoryName(p.category).toLowerCase().includes(term)
                );
            }

            // Una categoria selezionata mostra sempre la sua intestazione (anche se vuota),
            // così è possibile rinominarla o eliminarla
            const selectedCategory = data.categories.find(c => c.id === currentCategory);
            if (selectedCategory) {
                container.innerHTML = createCategorySection(selectedCategory.id, filteredPrompts);
                return;
            }

            if (filteredPrompts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>Nessun prompt trovato</p>
                    </div>
                `;
                return;
            }

            // Raggruppa per categoria o visualizza i preferiti
            if (currentCategory === 'favorites') {
                const categoryHtml = `
                    <div class="category-section">
                        <div class="category-header">
                            <h2 class="category-title">⭐ Preferiti</h2>
                        </div>
                        ${filteredPrompts.map(prompt => createPromptCard(prompt)).join('')}
                    </div>
                `;
                container.innerHTML = categoryHtml;
            } else {
                const grouped = {};
                filteredPrompts.forEach(prompt => {
                    if (!grouped[prompt.category]) {
                        grouped[prompt.category] = [];
                    }
                    grouped[prompt.category].push(prompt);
                });

                container.innerHTML = Object.entries(grouped)
                    .map(([catId, prompts]) => createCategorySection(catId, prompts))
                    .join('');
            }
        }

        function getCategoryName(catId) {
            const category = data.categories.find(c => c.id === catId);
            return category ? category.name : 'Senza Categoria';
        }

        function createCategorySection(catId, prompts) {
            const category = data.categories.find(c => c.id === catId);
            const actions = category ? `
                                <div class="prompt-actions">
                                    <button class="action-btn" data-category="${escapeHtml(category.id)}"
                                            onclick="renameCategory(this.dataset.category)">✏️ Rinomina</button>
                                    <button class="action-btn" data-category="${escapeHtml(category.id)}"
                                            onclick="deleteCategory(this.dataset.category)">🗑️ Elimina</button>
                                </div>` : '';
            const body = prompts.length
                ? prompts.map(prompt => createPromptCard(prompt)).join('')
                : '<div class="empty-state"><p>Nessun prompt trovato</p></div>';
            return `
                        <div class="category-section">
                            <div class="category-header">
                                <h2 class="category-title">${escapeHtml(getCategoryName(catId))}</h2>${actions}
                            </div>
                            ${body}
                        </div>
                    `;
        }

        function createPromptCard(prompt) {
            return `
                <div class="prompt-card">
                    <div class="prompt-header">
                        <h3 class="prompt-title">${escapeHtml(prompt.title)}</h3>
                        <div class="prompt-actions">
                            <button class="action-btn copy-btn" onclick="copyPrompt(${prompt.id})">
                                📋 Copia
                            </button>
                            <button class="action-btn favorite-btn ${data.favorites && data.favorites.includes(prompt.id) ? 'favorited' : ''}" 
                                    onclick="toggleFavorite(${prompt.id})">
                                ${data.favorites && data.favorites.includes(prompt.id) ? '⭐' : '☆'} Preferito
                            </button>
                            <button class="action-btn" onclick="editPrompt(${prompt.id})">
                                ✏️ Modifica
                            </button>
                            <button class="action-btn" onclick="toggleExpand(${prompt.id})">
                                🔍 Espandi
                            </button>
                            <button class="action-btn" onclick="deletePrompt(${prompt.id})">
                                🗑️ Elimina
                            </button>
                        </div>
                    </div>
                    <div class="prompt-content" id="prompt-${prompt.id}">${escapeHtml(prompt.content)}</div>
                </div>
            `;
        }

        function filterByCategory(catId) {
            currentCategory = catId;
            renderCategories();
            renderPrompts();
        }

        function toggleFavorite(id) {
            if (!data.favorites) {
                data.favorites = [];
            }
            
            const index = data.favorites.indexOf(id);
            if (index > -1) {
                data.favorites.splice(index, 1);
                showToast('Rimosso dai preferiti');
            } else {
                data.favorites.push(id);
                showToast('Aggiunto ai preferiti');
            }
            
            saveData();
            renderCategories();
            renderPrompts();
        }

        function copyPrompt(id) {
            const prompt = data.prompts.find(p => p.id === id);
            if (!prompt) return;
            // Il bottone va letto subito: dentro la Promise window.event non esiste più
            const btn = event.currentTarget;
            copyText(prompt.content).then(ok => {
                if (!ok) {
                    showToast('Impossibile copiare il prompt');
                    return;
                }
                showToast('Prompt copiato negli appunti!');
                btn.classList.add('copied');
                btn.textContent = '✓ Copiato';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = '📋 Copia';
                }, 2000);
            });
        }

        // Copia negli appunti dalla finestra indicata (la principale o l'overlay):
        // la Clipboard API funziona solo dal documento che ha il focus
        function copyText(text, win = window) {
            if (win.navigator.clipboard && win.isSecureContext) {
                return win.navigator.clipboard.writeText(text)
                    .then(() => true, () => fallbackCopy(text, win.document));
            }
            return Promise.resolve(fallbackCopy(text, win.document));
        }

        // Copia per contesti senza Clipboard API (es. pagina aperta via http in rete locale)
        function fallbackCopy(text, doc = document) {
            const textarea = doc.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            doc.body.appendChild(textarea);
            textarea.select();
            let ok = false;
            try {
                ok = doc.execCommand('copy');
            } catch (error) {
                ok = false;
            }
            doc.body.removeChild(textarea);
            return ok;
        }

        function toggleExpand(id) {
            const content = document.getElementById(`prompt-${id}`);
            content.classList.toggle('expanded');
            event.target.textContent = content.classList.contains('expanded') ? '🔻 Riduci' : '🔍 Espandi';
        }

        function deletePrompt(id) {
            if (confirm('Sei sicuro di voler eliminare questo prompt?')) {
                data.prompts = data.prompts.filter(p => p.id !== id);
                if (data.favorites) {
                    data.favorites = data.favorites.filter(favId => favId !== id);
                }
                saveData();
                renderCategories();
                renderPrompts();
                updateStats();
                showToast('Prompt eliminato');
            }
        }

        function editPrompt(id) {
            const prompt = data.prompts.find(p => p.id === id);
            if (prompt) {
                const select = document.getElementById('editPromptCategory');
                const hasCategory = data.categories.some(cat => cat.id === prompt.category);
                select.innerHTML = (hasCategory ? '' : '<option value="" selected>Senza Categoria</option>') +
                    data.categories.map(cat =>
                        `<option value="${escapeHtml(cat.id)}" ${cat.id === prompt.category ? 'selected' : ''}>${escapeHtml(cat.name)}</option>`
                    ).join('');

                document.getElementById('editPromptId').value = prompt.id;
                document.getElementById('editPromptTitle').value = prompt.title;
                document.getElementById('editPromptContent').value = prompt.content;
                document.getElementById('editPromptModal').classList.add('active');
            }
        }

        function openAddCategoryModal() {
            document.getElementById('addCategoryModal').classList.add('active');
        }

        function handleAddPrompt(e) {
            e.preventDefault();
            const newPrompt = {
                id: Date.now(),
                title: document.getElementById('promptTitle').value,
                category: document.getElementById('promptCategory').value,
                content: document.getElementById('promptContent').value
            };
            data.prompts.push(newPrompt);
            saveData();
            renderPrompts();
            updateStats();
            closeModal('addPromptModal');
            showToast('Prompt aggiunto con successo!');
        }

        function handleEditPrompt(e) {
            e.preventDefault();
            const promptId = parseInt(document.getElementById('editPromptId').value);
            const promptIndex = data.prompts.findIndex(p => p.id === promptId);
            
            if (promptIndex !== -1) {
                data.prompts[promptIndex].title = document.getElementById('editPromptTitle').value;
                data.prompts[promptIndex].category = document.getElementById('editPromptCategory').value;
                data.prompts[promptIndex].content = document.getElementById('editPromptContent').value;
                
                saveData();
                renderPrompts();
                closeModal('editPromptModal');
                showToast('Prompt modificato con successo!');
            }
        }

        function categoryNameExists(name, exceptId = null) {
            return data.categories.some(c => c.id !== exceptId && c.name.toLowerCase() === name.toLowerCase());
        }

        function handleAddCategory(e) {
            e.preventDefault();
            const name = document.getElementById('categoryName').value.trim();
            if (!name) return;
            if (categoryNameExists(name)) {
                showToast('Esiste già una categoria con questo nome');
                return;
            }
            const newCategory = {
                id: Date.now().toString(),
                name: name
            };
            data.categories.push(newCategory);
            saveData();
            renderCategories();
            updateStats();
            closeModal('addCategoryModal');
            showToast('Categoria aggiunta con successo!');
        }

        function renameCategory(catId) {
            const category = data.categories.find(c => c.id === catId);
            if (!category) return;
            const name = (prompt('Nuovo nome della categoria:', category.name) || '').trim();
            if (!name || name === category.name) return;
            if (categoryNameExists(name, catId)) {
                showToast('Esiste già una categoria con questo nome');
                return;
            }
            category.name = name;
            saveData();
            renderCategories();
            renderPrompts();
            showToast('Categoria rinominata');
        }

        function deleteCategory(catId) {
            const category = data.categories.find(c => c.id === catId);
            if (!category) return;
            const count = data.prompts.filter(p => p.category === catId).length;
            const message = count
                ? `Eliminare la categoria "${category.name}"? I suoi ${count} prompt NON verranno eliminati: finiranno in "Senza Categoria" (visibili in "Tutti i Prompt").`
                : `Eliminare la categoria "${category.name}"?`;
            if (!confirm(message)) return;
            data.categories = data.categories.filter(c => c.id !== catId);
            data.prompts.forEach(p => {
                if (p.category === catId) p.category = '';
            });
            if (currentCategory === catId) currentCategory = 'all';
            saveData();
            renderCategories();
            renderPrompts();
            updateStats();
            showToast('Categoria eliminata');
        }

        function updateStats() {
            document.getElementById('totalPrompts').textContent = data.prompts.length;
            document.getElementById('totalCategories').textContent = data.categories.length;
        }

        function saveData() {
            localStorage.setItem('promptManagerData', JSON.stringify(data));
            // Ricorda da quando esistono modifiche non ancora esportate
            if (!localStorage.getItem('promptManagerUnsavedSince')) {
                localStorage.setItem('promptManagerUnsavedSince', Date.now().toString());
            }
            renderOverlayFavorites();
        }

        // I dati vivono solo in questo browser: se ci sono modifiche non esportate
        // da più di BACKUP_REMINDER_DAYS giorni, suggerisce un backup
        const BACKUP_REMINDER_DAYS = 7;

        function checkBackupReminder() {
            const since = parseInt(localStorage.getItem('promptManagerUnsavedSince'));
            if (!since) return;
            const days = Math.floor((Date.now() - since) / (1000 * 60 * 60 * 24));
            if (days < BACKUP_REMINDER_DAYS) return;
            document.getElementById('backupReminderText').textContent =
                `⚠️ Hai modifiche non salvate in un backup da ${days} giorni. I prompt sono salvati solo in questo browser: esportali per non perderli.`;
            document.getElementById('backupReminder').hidden = false;
        }

        function exportData() {
            const dataStr = JSON.stringify(data, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `prompts_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            localStorage.removeItem('promptManagerUnsavedSince');
            document.getElementById('backupReminder').hidden = true;
            showToast('Dati esportati con successo!');
        }

        function importData() {
            document.getElementById('importFile').click();
        }

        function handleImport(e) {
            const file = e.target.files[0];
            // Azzera il campo, altrimenti re-importare lo stesso file non scatena "change"
            e.target.value = '';
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (Array.isArray(importedData.categories) && Array.isArray(importedData.prompts)) {
                            if (!confirm(`L'importazione sostituirà tutti i ${data.prompts.length} prompt attuali con i ${importedData.prompts.length} del file. Continuare?`)) {
                                return;
                            }
                            data = importedData;
                            if (!Array.isArray(data.favorites)) {
                                data.favorites = [];
                            }
                            currentCategory = 'all';
                            saveData();
                            // I dati appena importati coincidono con il file: sono già un backup
                            localStorage.removeItem('promptManagerUnsavedSince');
                            renderCategories();
                            renderPrompts();
                            updateStats();
                            showToast('Dati importati con successo!');
                        } else {
                            showToast('File non valido');
                        }
                    } catch (error) {
                        showToast('Errore nell\'importazione del file');
                    }
                };
                reader.readAsText(file);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Gestione click fuori dai modal: chiude solo se anche il mousedown è avvenuto
        // sullo sfondo, così selezionare testo trascinando fuori dal form non lo chiude
        let mouseDownTarget = null;
        window.addEventListener('mousedown', (event) => {
            mouseDownTarget = event.target;
        });
        window.onclick = (event) => {
            if (event.target.classList.contains('modal') && mouseDownTarget === event.target) {
                event.target.classList.remove('active');
            }
        };

        // === Overlay sempre in primo piano (ex app PromptOverlay) ===
        // Preferiti da copiare con un clic + box di testo liberi (Copia, Pulisci, Salva).
        // Usa Document Picture-in-Picture (Chrome/Edge desktop); altrove apre un popup normale.
        const OVERLAY_DEFAULT_BOXES = 3;
        let overlayBoxes = loadOverlayBoxes();

        function loadOverlayBoxes() {
            try {
                const boxes = JSON.parse(localStorage.getItem('promptManagerOverlayBoxes'));
                if (Array.isArray(boxes) && boxes.length >= OVERLAY_DEFAULT_BOXES) return boxes;
            } catch (error) {
                // dati non leggibili: si riparte dai box vuoti
            }
            return Array(OVERLAY_DEFAULT_BOXES).fill('');
        }

        function saveOverlayBoxes() {
            localStorage.setItem('promptManagerOverlayBoxes', JSON.stringify(overlayBoxes));
        }

        async function openOverlay() {
            if (overlayWindow && !overlayWindow.closed) {
                overlayWindow.focus();
                return;
            }
            if ('documentPictureInPicture' in window) {
                try {
                    overlayWindow = await documentPictureInPicture.requestWindow({ width: 380, height: 600 });
                } catch (error) {
                    showToast('Impossibile aprire l\'overlay');
                    return;
                }
            } else {
                overlayWindow = window.open('', 'promptOverlay', 'width=380,height=600');
                if (!overlayWindow) {
                    showToast('Popup bloccato: consenti i popup per aprire l\'overlay');
                    return;
                }
                showToast('Il browser non supporta finestre sempre in primo piano: overlay aperto come finestra normale');
            }

            const doc = overlayWindow.document;
            doc.title = 'Prompt Overlay';
            document.querySelectorAll('style').forEach(style => doc.head.appendChild(style.cloneNode(true)));
            doc.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') || 'light');
            doc.body.innerHTML = `
                <div class="overlay">
                    <h2 class="overlay-title">⭐ Preferiti</h2>
                    <div id="overlayFavorites"></div>
                    <h2 class="overlay-title">📝 Box</h2>
                    <div id="overlayBoxes"></div>
                    <button class="btn" id="overlayAddBox" style="width: 100%;">+ Aggiungi box</button>
                </div>
            `;
            doc.getElementById('overlayAddBox').addEventListener('click', () => {
                overlayBoxes.push('');
                saveOverlayBoxes();
                renderOverlayBoxes();
            });
            overlayWindow.addEventListener('pagehide', () => {
                overlayWindow = null;
            });

            renderOverlayFavorites();
            renderOverlayBoxes();
        }

        function renderOverlayFavorites() {
            if (!overlayWindow || overlayWindow.closed) return;
            const container = overlayWindow.document.getElementById('overlayFavorites');
            const favorites = data.prompts.filter(p => data.favorites && data.favorites.includes(p.id));
            if (!favorites.length) {
                container.innerHTML = '<p class="overlay-empty">Nessun preferito: aggiungili con ☆ nella libreria.</p>';
                return;
            }
            container.innerHTML = favorites.map(p => `
                <div class="overlay-row">
                    <span class="overlay-label" title="${escapeHtml(p.title)}">${escapeHtml(p.title)}</span>
                    <button class="action-btn">📋 Copia</button>
                </div>
            `).join('');
            container.querySelectorAll('button').forEach((btn, i) => {
                btn.addEventListener('click', () => {
                    copyText(favorites[i].content, overlayWindow)
                        .then(ok => flashButton(btn, ok ? '✓ Copiato' : 'Errore', '📋 Copia'));
                });
            });
        }

        function renderOverlayBoxes() {
            if (!overlayWindow || overlayWindow.closed) return;
            const container = overlayWindow.document.getElementById('overlayBoxes');
            container.innerHTML = overlayBoxes.map((text, i) => `
                <div class="overlay-box">
                    <div class="overlay-row">
                        <span class="overlay-label">Box ${i + 1}</span>
                        <button class="action-btn" data-action="copy">📋 Copia</button>
                        <button class="action-btn" data-action="clean">🧹 Pulisci</button>
                        <button class="action-btn" data-action="save" title="Salva nella libreria">💾</button>
                        ${i >= OVERLAY_DEFAULT_BOXES ? '<button class="action-btn" data-action="remove" title="Rimuovi box">×</button>' : ''}
                    </div>
                    <textarea class="form-textarea"></textarea>
                </div>
            `).join('');
            container.querySelectorAll('.overlay-box').forEach((boxEl, i) => {
                const textarea = boxEl.querySelector('textarea');
                textarea.value = overlayBoxes[i];
                textarea.addEventListener('input', () => {
                    overlayBoxes[i] = textarea.value;
                    saveOverlayBoxes();
                });
                boxEl.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => handleOverlayBoxAction(btn, i, textarea));
                });
            });
        }

        function handleOverlayBoxAction(btn, index, textarea) {
            const action = btn.dataset.action;
            // Etichetta originale salvata al primo clic, così i clic ripetuti non la perdono
            const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
            const text = textarea.value;
            if ((action === 'copy' || action === 'save') && !text.trim()) {
                flashButton(btn, 'Vuoto', label);
                return;
            }
            if (action === 'copy') {
                copyText(text, overlayWindow).then(ok => flashButton(btn, ok ? '✓ Copiato' : 'Errore', label));
            } else if (action === 'clean') {
                overlayBoxes[index] = '';
                textarea.value = '';
                saveOverlayBoxes();
                flashButton(btn, '✓ Pulito', label);
            } else if (action === 'save') {
                // Finisce in "Senza Categoria": titolo e categoria si sistemano poi con Modifica
                data.prompts.push({
                    id: Date.now(),
                    title: text.trim().split('\n')[0].slice(0, 60),
                    category: '',
                    content: text
                });
                saveData();
                renderPrompts();
                updateStats();
                flashButton(btn, '✓', label);
                showToast('Prompt salvato dall\'overlay in "Senza Categoria"');
            } else if (action === 'remove') {
                overlayBoxes.splice(index, 1);
                saveOverlayBoxes();
                renderOverlayBoxes();
            }
        }

        function flashButton(btn, message, resetText) {
            btn.textContent = message;
            setTimeout(() => {
                btn.textContent = resetText;
            }, 1000);
        }

        // PWA Installation and Service Worker
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-install').style.display = 'block';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('PWA installata');
                        document.getElementById('pwa-install').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registered successfully');
                    }, function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        window.addEventListener('appinstalled', () => {
            document.getElementById('pwa-install').style.display = 'none';
            console.log('PWA was installed');
        });

        // Keyboard Navigation Support
        function initializeKeyboardSupport() {
            // Global keyboard shortcuts
            document.addEventListener('keydown', handleGlobalKeyboard);
            
            // Category navigation
            setupCategoryNavigation();
            
            // Search focus shortcuts
            setupSearchNavigation();
            
            // Modal keyboard support
            setupModalNavigation();
            
            // Show keyboard help
            showKeyboardHelp();
        }

        function handleGlobalKeyboard(e) {
            // Skip if user is typing in inputs
            const isTyping = e.target.matches('input, textarea, select');
            if (isTyping && e.target !== document.getElementById('searchBar')) {
                return;
            }
            // Le scorciatoie a tasto singolo (H, ?, 1-9) non devono bloccare la digitazione
            // nella barra di ricerca né agire sotto un modal aperto
            const singleKeyAllowed = !isTyping && !e.ctrlKey && !e.metaKey && !e.altKey &&
                !document.querySelector('.modal.active');

            // Global shortcuts
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchBar').focus();
            } else if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                openAddPromptModal();
            } else if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                exportData();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeAllModals();
            } else if (!singleKeyAllowed) {
                return;
            } else if (e.key === 'h' || e.key === '?') {
                e.preventDefault();
                showKeyboardHelp(true);
            } else if (e.key === 'o') {
                e.preventDefault();
                openOverlay();
            } else if (e.key >= '1' && e.key <= '9') {
                // Quick category selection
                const categoryIndex = parseInt(e.key) - 1;
                const categories = document.querySelectorAll('#categoryNav .category-link');
                if (categories[categoryIndex]) {
                    categories[categoryIndex].click();
                }
            }
        }

        function setupCategoryNavigation() {
            // Add keyboard navigation to category sidebar
            const categoryList = document.getElementById('categoryNav');
            if (categoryList) {
                categoryList.setAttribute('role', 'navigation');
                categoryList.setAttribute('aria-label', 'Categorie prompt');
            }
        }

        function setupSearchNavigation() {
            const searchBar = document.getElementById('searchBar');
            if (searchBar) {
                searchBar.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        // Focus first prompt card if available
                        const firstPrompt = document.querySelector('.prompt-card .action-btn');
                        if (firstPrompt) firstPrompt.focus();
                    } else if (e.key === 'Escape') {
                        searchBar.value = '';
                        renderPrompts();
                        searchBar.blur();
                    }
                });
            }
        }

        function setupModalNavigation() {
            // Enhanced modal focus trap
            document.addEventListener('keydown', (e) => {
                const activeModal = document.querySelector('.modal.active');
                if (activeModal && e.key === 'Tab') {
                    trapFocus(e, activeModal);
                }
            });
        }

        function trapFocus(e, modal) {
            const focusableElements = modal.querySelectorAll(
                'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
            );
            
            const firstFocusable = focusableElements[0];
            const lastFocusable = focusableElements[focusableElements.length - 1];

            if (e.shiftKey) {
                if (document.activeElement === firstFocusable) {
                    lastFocusable.focus();
                    e.preventDefault();
                }
            } else {
                if (document.activeElement === lastFocusable) {
                    firstFocusable.focus();
                    e.preventDefault();
                }
            }
        }

        function closeAllModals() {
            document.querySelectorAll('.modal.active').forEach(modal => {
                modal.classList.remove('active');
            });
        }

        function showKeyboardHelp(persistent = false) {
            let helpDiv = document.getElementById('keyboard-help');
            if (!helpDiv) {
                helpDiv = document.createElement('div');
                helpDiv.id = 'keyboard-help';
                helpDiv.className = 'keyboard-help';
                helpDiv.innerHTML = `
                    <strong>Scorciatoie da tastiera:</strong><br>
                    <kbd>Ctrl+F</kbd> Cerca prompt<br>
                    <kbd>Ctrl+N</kbd> Nuovo prompt<br>
                    <kbd>Ctrl+S</kbd> Esporta dati<br>
                    <kbd>Esc</kbd> Chiudi modal<br>
                    <kbd>1-9</kbd> Seleziona categoria<br>
                    <kbd>O</kbd> Apri overlay<br>
                    <kbd>H</kbd>/<kbd>?</kbd> Mostra aiuto<br>
                    <small>Tab per navigare, Enter per attivare</small>
                `;
                document.body.appendChild(helpDiv);
            }
            
            helpDiv.classList.add('show');
            
            if (!persistent) {
                setTimeout(() => {
                    helpDiv.classList.remove('show');
                }, 4000);
            } else {
                // Click to dismiss
                helpDiv.addEventListener('click', () => {
                    helpDiv.classList.remove('show');
                }, { once: true });
                
                setTimeout(() => {
                    helpDiv.classList.remove('show');
                }, 10000);
            }
        }

        // Enhanced functions with better keyboard support
        function openAddPromptModal() {
            const select = document.getElementById('promptCategory');
            select.innerHTML = data.categories.map(cat => 
                `<option value="${escapeHtml(cat.id)}">${escapeHtml(cat.name)}</option>`
            ).join('');
            document.getElementById('addPromptModal').classList.add('active');

            // Focus first input
            setTimeout(() => {
                document.getElementById('promptTitle').focus();
            }, 100);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            
            // Return focus to trigger element or search bar
            const searchBar = document.getElementById('searchBar');
            if (searchBar) searchBar.focus();
            
            // Reset forms
            if (modalId === 'addPromptModal') {
                document.getElementById('addPromptForm').reset();
            } else if (modalId === 'editPromptModal') {
                document.getElementById('editPromptForm').reset();
            } else if (modalId === 'addCategoryModal') {
                document.getElementById('addCategoryForm').reset();
            }
        }
    </script>
</body>
</html>
